# Enable Displays
CONFIG_ZMK_DISPLAY=y

# Turn off the default ZMK screen to allow the widget to take over
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILTIN=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_BONGO_CAT=y
CONFIG_LV_Z_VDB_SIZE=32

CONFIG_ZMK_SPLIT=y

# ZMK sleep settings
CONFIG_ZMK_SLEEP=y

# Timeout in millisec  -- 5 mins idle state and 15 mins deep sleep
CONFIG_ZMK_IDLE_TIMEOUT=900000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
  
# Enable ZMK Studio
CONFIG_ZMK_STUDIO=y

# Explicitly ensure the built-in status screen widgets are on
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
